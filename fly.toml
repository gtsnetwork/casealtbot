# fly.toml app configuration file generated for casealtbot on 2026-11-13T15:28:41Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'casealtbot'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  CURRENCY = 'Rs.'
  DB_PATH = '/app/store.db'

[processes]
  app = 'python main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
